version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: radioheaven-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: radioheaven
      MYSQL_USER: radiouser
      MYSQL_PASSWORD: radiopass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: radioheaven-app
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-radiouser}
      DB_PASSWORD: ${DB_PASSWORD:-radiopass}
      FIREBASE_KEY_PATH: ${FIREBASE_KEY_PATH:-/app/config/serviceAccountKey.json}
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - ./config/serviceAccountKey.json:/app/config/serviceAccountKey.json:ro
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
